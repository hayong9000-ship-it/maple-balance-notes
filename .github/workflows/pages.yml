name: Publish Maple Balance
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import prepared website source
        run: |
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          allowed = {'src', 'scripts', 'package.json', 'README.md', 'TEMPLATE.md', '.gitignore'}
          with ZipFile('site-source.zip') as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Invalid archive path')
                  if path.parts and path.parts[0] in allowed:
                      archive.extract(item, '.')
          PY
      - name: Build and validate website
        run: |
          node scripts/build.mjs
          node scripts/validate.mjs
      - name: Save source files in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts package.json README.md TEMPLATE.md .gitignore
          git rm site-source.zip
          git commit -m 'Add Maple Balance website source and skill assets'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
